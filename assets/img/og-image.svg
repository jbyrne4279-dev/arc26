    <path transform="translate(30, 20) scale(1.35)" fill="#0A1229" d="M17.05 12.04c-.03-2.6 2.12-3.85 2.22-3.91-1.21-1.77-3.09-2.01-3.76-2.04-1.6-.16-3.12.94-3.93.94-.81 0-2.06-.92-3.39-.9-1.74.03-3.35 1.01-4.25 2.57-1.81 3.14-.46 7.79 1.3 10.34.86 1.25 1.88 2.65 3.22 2.6 1.29-.05 1.78-.83 3.34-.83 1.56 0 2 .83 3.37.81 1.39-.03 2.27-1.27 3.12-2.53.98-1.45 1.38-2.85 1.4-2.92-.03-.01-2.69-1.03-2.72-4.09zM14.6 4.5c.71-.86 1.19-2.06 1.06-3.25-1.02.04-2.26.68-3 1.54-.66.76-1.24 1.98-1.08 3.14 1.14.09 2.31-.58 3.02-1.43z"/>
    <text x="72" y="30" fill="#0A1229" fill-opacity="0.7" font-family="-apple-system, Inter, Arial, sans-serif" font-size="14" font-weight="500">Download on the</text>
    <text x="72" y="54" fill="#0A1229" font-family="-apple-system, Inter, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.5">App Store</text>
  </g>

  <!-- rank swatches, right side -->
