<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1A38"/>
      <stop offset="1" stop-color="#050A1F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop stop-color="#408CFA" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#408CFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="80" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#599EFF"/>
      <stop offset="1" stop-color="#B873FA"/>
    </linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C7F2FF"/>
      <stop offset="1" stop-color="#408CFA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- brand row -->
  <g transform="translate(80, 78)">
    <g stroke="url(#frost)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.62)">
      <path d="M32 6 V58"/>
      <path d="M9.5 19 L54.5 45"/>
      <path d="M54.5 19 L9.5 45"/>
      <path d="M32 15 L26 21 M32 15 L38 21"/>
      <path d="M32 49 L26 43 M32 49 L38 43"/>
    </g>
    <text x="52" y="30" fill="#FFFFFF" font-family="-apple-system, Inter, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="3">WINTER ARC 26</text>
  </g>

  <!-- headline -->
  <text x="80" y="300" fill="#FFFFFF" font-family="-apple-system, Inter, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-2">Stop scrolling.</text>
  <text x="80" y="400" fill="url(#grad)" font-family="-apple-system, Inter, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-2">Start climbing.</text>

  <!-- subline -->
  <text x="80" y="470" fill="#FFFFFF" fill-opacity="0.72" font-family="-apple-system, Inter, Arial, sans-serif" font-size="30" font-weight="400">The men's discipline app that makes you prove it.</text>

  <!-- App Store pill -->
  <g transform="translate(80, 512)">
