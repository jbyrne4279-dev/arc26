      <circle cx="8" cy="86" r="8" fill="#FCC71F"/><text x="30" y="93">Grandmaster</text>
      <circle cx="8" cy="130" r="8" fill="#FA4742"/><text x="30" y="137">Master</text>
      <circle cx="8" cy="174" r="8" fill="#8F5CEB"/><text x="30" y="181">Obsidian</text>
